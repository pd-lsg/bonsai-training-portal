<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bonsai Training Portal</title>
<meta name="description" content="Bonsai Smokehouse — staff training and reference portal">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4ece1">
<link rel="apple-touch-icon" href="photos/brand/icon-192.png">
<style>
:root{
  --cream:#f4ece1;
  --cream-card:#ffffff;
  --ink:#2c3539;
  --ink-soft:#5b6469;
  --rule:#e4d9c8;
  --accent:#de7764;
  --accent-deep:#c15c48;
  --tag-fish:#c1503c;
  --tag-dairy:#3a6ea5;
  --tag-gluten:#a67c2e;
  --tag-veg:#4a7c59;
  --tag-nut:#7a5c3e;
  --tag-egg:#b8952f;
  --tag-soy:#5c7a6b;
  --tag-sesame:#8a5a44;
  --tag-mustard:#9a7c2e;
  --shadow: 0 1px 3px rgba(44,53,57,0.08), 0 1px 2px rgba(44,53,57,0.06);
  --shadow-lg: 0 8px 24px rgba(44,53,57,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
a{color:inherit;}
button{font-family:inherit;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(244,236,225,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 18px;
}
.brand-mark{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.brand-mark .logo-b{
  width:30px;height:30px;background:var(--ink);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--cream);
  font-weight:700;font-size:18px;font-family:Georgia,serif;
}
.brand-mark .word{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-family:inherit;}
.brand-mark .word b{color:var(--ink);font-weight:600;letter-spacing:.02em;text-transform:none;font-size:18px;}

.topbar-actions{display:flex;align-items:center;gap:10px;}
.backbtn{
  display:none;
  align-items:center;gap:6px;
  font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-soft); background:none; border:none; cursor:pointer;
  padding:8px 4px;
}
.backbtn.show{display:inline-flex;}
.langtoggle{
  display:flex; border:1.5px solid var(--ink); border-radius:999px; overflow:hidden;
  font-size:12px; font-weight:600; letter-spacing:.04em;
}
.langtoggle button{
  border:none; background:var(--cream); color:var(--ink);
  padding:7px 14px; cursor:pointer; transition:.15s;
}
.langtoggle button.active{background:var(--ink); color:var(--cream);}

/* ---------- Layout ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:28px 20px 90px;}
.eyebrow{
  font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent-deep);
  font-family:inherit; text-align:center; margin-bottom:10px; font-weight:600;
}
h1.pagetitle{
  text-align:center; font-size:clamp(30px,5vw,44px); margin:0 0 6px; font-weight:600;
}
.subtitle{text-align:center; color:var(--ink-soft); font-style:italic; font-size:17px; margin-bottom:26px;}
.intro{max-width:680px; margin:0 auto 34px; text-align:center; color:var(--ink-soft); font-size:16px; line-height:1.6;}

/* ---------- Home grid ---------- */
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:480px){.grid{grid-template-columns:1fr;}}
.card{
  background:var(--cream-card); border:1px solid var(--rule); border-radius:var(--radius);
  padding:22px 20px; cursor:pointer; transition:.18s; box-shadow:var(--shadow);
}
.card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--accent);}
.card .icon{
  width:44px;height:44px;border-radius:50%;background:#fbeee9;display:flex;align-items:center;justify-content:center;
  font-size:20px; margin-bottom:14px;
}
.card h3{margin:0 0 6px; font-size:19px; font-weight:600;}
.card p{margin:0 0 10px; color:var(--ink-soft); font-size:14px; line-height:1.5; font-family:inherit;}
.card .tag{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--accent-deep);
}

/* ---------- Section header ---------- */
.section-head{text-align:center; padding:6px 0 30px;}
.section-head .tapnote{font-size:13px; color:var(--ink-soft); font-style:italic;}

/* ---------- Item cards (food/beverage/ingredient/deli) ---------- */
.itemlist{display:flex; flex-direction:column; gap:14px;}
.item{
  background:var(--cream-card); border:1px solid var(--rule); border-radius:var(--radius);
  overflow:hidden; box-shadow:var(--shadow);
}
.item-head{
  display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
  padding:18px 20px; cursor:pointer;
}
.item-head:hover{background:#fbf6ee;}
.item-title{flex:1;}
.item-title h3{margin:0 0 4px; font-size:19px; font-weight:600;}
.item-title .sub{color:var(--ink-soft); font-style:italic; font-size:14px;}
.item-price{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-weight:700; font-size:17px; color:var(--accent-deep); white-space:nowrap;}
.item-chevron{font-size:12px; color:var(--ink-soft); margin-left:8px; transition:.15s;}
.item.open .item-chevron{transform:rotate(90deg);}
.item-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.item.open .item-body{max-height:900px;}
.item-body-inner{padding:0 20px 20px; border-top:1px solid var(--rule); padding-top:14px;}
.item-body-inner p{margin:0 0 10px; line-height:1.6; font-size:15px;}
.tagrow{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.pill{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  color:#fff; padding:4px 9px; border-radius:999px;
}
.pill.warn{background:#b23a2f;}
.pill.note{background:var(--ink-soft);}
.pill.veg{background:var(--tag-veg);}
.note-block{
  background:#fbf6ee; border-left:3px solid var(--accent); padding:10px 14px; border-radius:6px;
  font-size:13.5px; color:var(--ink-soft); margin-top:10px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
.pending{
  background:#fdf1e8; border:1px dashed var(--accent-deep); border-radius:8px; padding:10px 14px;
  font-size:13px; color:var(--accent-deep); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-weight:600;
}

.item-photo{
  width:100%; aspect-ratio:16/9; background:#e9dfd0; border-radius:10px 10px 0 0;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.item-photo img{width:100%;height:100%;object-fit:contain;display:block;}
.item-photo .placeholder{color:#b3a58e; font-size:12px; text-align:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; letter-spacing:.05em; text-transform:uppercase;}

/* ---------- Sub-section titles within a page ---------- */
.groupheading{
  font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-deep);
  font-weight:700; margin:34px 0 12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
.groupheading:first-of-type{margin-top:6px;}
.grouplede{color:var(--ink-soft); font-size:14px; font-style:italic; margin:-6px 0 16px; white-space:pre-line;}

/* ---------- Allergen matrix ---------- */
.matrix{width:100%; border-collapse:collapse; font-size:13px; background:var(--cream-card); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
.matrix th,.matrix td{padding:10px 8px; text-align:center; border-bottom:1px solid var(--rule);}
.matrix th{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
.matrix td:first-child,.matrix th:first-child{text-align:left; font-weight:600; padding-left:14px;}
.matrix tr:last-child td{border-bottom:none;}
.matrix .dot{width:9px;height:9px;border-radius:50%;background:var(--accent-deep);display:inline-block;}
.matrixwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}

/* ---------- Flip/step cards for standards ---------- */
.stepgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media (max-width:640px){.stepgrid{grid-template-columns:1fr;}}
.stepcard{background:var(--cream-card); border:1px solid var(--rule); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.stepcard .num{font-size:11px; color:var(--accent-deep); font-weight:700; letter-spacing:.06em; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.stepcard h4{margin:6px 0 8px; font-size:17px; font-weight:600;}
.stepcard p{margin:0; color:var(--ink-soft); font-size:14px; line-height:1.55;}

/* ---------- Install page ---------- */
.installcard{max-width:520px; margin:0 auto; background:var(--cream-card); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:30px 28px;}
.installcard h2{text-align:center; font-size:15px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 4px;}
.installcard .lede{text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:24px;}
.oslabel{font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--accent-deep); border-bottom:1px solid var(--rule); padding-bottom:8px; margin:22px 0 12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.stepline{display:flex; gap:12px; align-items:flex-start; margin-bottom:14px;}
.stepline .bullet{width:22px;height:22px;min-width:22px;border-radius:50%;background:var(--ink);color:var(--cream);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.stepline p{margin:2px 0 0; font-size:15px; line-height:1.5;}

/* ---------- Footer ---------- */
.footer{text-align:center; padding:40px 20px 20px; color:var(--ink-soft); font-size:12px;}
.footer .foot-brand{font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); margin-bottom:4px;}

/* ---------- Search ---------- */
.searchbar{max-width:560px;margin:0 auto 30px;}
.searchbar input{
  width:100%; padding:13px 18px; border-radius:999px; border:1.5px solid var(--rule);
  background:var(--cream-card); font-size:15px; color:var(--ink); font-family:inherit;
}
.searchbar input:focus{outline:none; border-color:var(--accent);}

.hidden{display:none !important;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand-mark" onclick="goHome()">
    <div class="logo-b">b</div>
    <div class="word sans">Bonsai <b class="i18n" data-en="Training" data-es="Capacitación">Training</b></div>
  </div>
  <div class="topbar-actions">
    <button class="backbtn sans" id="backBtn" onclick="goHome()">&larr; <span class="i18n" data-en="Portal Home" data-es="Inicio">Portal Home</span></button>
    <div class="langtoggle">
      <button id="btnEN" class="active" onclick="setLang('en')">EN</button>
      <button id="btnES" onclick="setLang('es')">ES</button>
    </div>
  </div>
</div>

<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
